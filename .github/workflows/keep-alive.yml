# The API keeps itself awake by pinging its own public URL (app/main.py). This is the
# backup that wakes it if it ever does sleep. GitHub runs scheduled workflows on a
# best-effort basis (observed: every 2-7 hours, not every 10 minutes), so this cannot be
# the primary keep-alive. A cold start takes up to a minute and Render answers 502 while
# it wakes, so curl keeps retrying for up to 3 minutes.
name: Keep API awake

on:
  schedule:
    # Off the :00/:10 marks, where GitHub drops the most scheduled runs under load.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: >-
          curl --fail --silent --show-error --max-time 60
          --retry 12 --retry-delay 15 --retry-max-time 180 --retry-all-errors
          https://listing-audit-api.onrender.com/api/health
